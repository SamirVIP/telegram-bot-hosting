<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BotForge</title>
<style>
:root{--bg:#0b0d12;--p:#12151d;--p2:#181c27;--l:#232938;--t:#e7eaf3;--m:#8b93a8;--a:#7c5cff;--g:#22c55e;--r:#ef4444;--y:#f59e0b}
*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%}
body{background:var(--bg);color:var(--t);font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0}
.btn{background:var(--a);color:#fff;padding:8px 14px;border-radius:9px;font-weight:600}.btn.g{background:var(--p2);font-weight:500}.btn.r{background:#3a1519;color:#fca5a5}.btn:disabled{opacity:.5}
.inp{background:var(--bg);border:1px solid var(--l);border-radius:9px;padding:9px 11px;outline:none;width:100%}.inp:focus{border-color:var(--a)}
#login{height:100%;display:grid;place-items:center}.card{background:var(--p);border:1px solid var(--l);border-radius:16px;padding:26px;width:340px;display:flex;flex-direction:column;gap:10px}
.card h1{font-size:22px}.card h1 b{color:var(--a)}.err{color:#fca5a5;min-height:18px}
#app{height:100%;display:none;grid-template-columns:290px 1fr}
aside{background:var(--p);border-right:1px solid var(--l);display:flex;flex-direction:column;min-height:0}
.top{padding:14px;display:flex;align-items:center;justify-content:space-between}.logo{font-weight:800;font-size:18px}.logo b{color:var(--a)}
#drop{margin:0 12px 10px;border:2px dashed var(--l);border-radius:12px;padding:16px;text-align:center;color:var(--m);cursor:pointer}#drop.on{border-color:var(--a);color:var(--t)}
#list{flex:1;overflow:auto;padding:0 8px 8px}
.bot{display:flex;gap:10px;align-items:center;padding:10px;border-radius:10px;cursor:pointer}.bot:hover{background:var(--p2)}.bot.on{background:var(--p2);outline:1px solid var(--a)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--m);flex:none}.dot.running{background:var(--g)}.dot.installing,.dot.restarting{background:var(--y)}
.bot div{min-width:0}.bot b,.bot small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bot small{color:var(--m)}
main{display:flex;flex-direction:column;min-width:0;min-height:0}
.empty{margin:auto;color:var(--m);text-align:center;padding:20px}
.hd{padding:14px 18px;border-bottom:1px solid var(--l);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.hd h2{font-size:18px}.pill{padding:2px 10px;border-radius:99px;background:var(--p2);color:var(--m);font-size:12px}.pill.running{background:#12301d;color:var(--g)}.pill.installing,.pill.restarting{background:#3a2c0e;color:var(--y)}
.sp{flex:1}.tabs{display:flex;gap:4px;padding:8px 18px 0;border-bottom:1px solid var(--l)}.tabs button{background:none;color:var(--m);padding:8px 14px;border-radius:8px 8px 0 0}.tabs button.on{color:var(--t);background:var(--p);border-bottom:2px solid var(--a)}
.pane{flex:1;min-height:0;display:none;flex-direction:column}.pane.on{display:flex}
#term{flex:1;overflow:auto;background:#07090d;padding:12px 16px;font:12.5px/1.5 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-all}
#term .h{color:#a78bfa}#term .e{color:#fca5a5}#term .c{color:var(--g)}
.cmd{display:flex;gap:8px;padding:10px;background:var(--p);border-top:1px solid var(--l);align-items:center}.cmd span{color:var(--g);font-family:ui-monospace,monospace}
.cmd input{flex:1;background:none;border:0;outline:none;font-family:ui-monospace,Menlo,monospace}
.scroll{overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
.row{display:grid;grid-template-columns:240px 1fr;gap:12px;align-items:start}.row label{font-family:ui-monospace,monospace;font-size:12.5px;word-break:break-all}.row small{display:block;color:var(--m);font-family:system-ui}
.req{background:#3a1519;color:#fca5a5;font-size:10px;padding:1px 6px;border-radius:5px;margin-left:6px}
.f{display:flex;justify-content:space-between;padding:6px 10px;background:var(--p);border-radius:8px;font:12.5px ui-monospace,monospace}.f small{color:var(--m)}
pre{background:#07090d;border-radius:10px;padding:12px;font:12.5px ui-monospace,monospace;overflow:auto}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--p2);border:1px solid var(--l);padding:10px 16px;border-radius:10px;display:none;z-index:9}
@media(max-width:800px){#app{grid-template-columns:1fr;grid-template-rows:220px 1fr}.row{grid-template-columns:1fr}}
</style></head><body>
<div id="login"><form class="card" id="lf"><h1>Bot<b>Forge</b></h1><small style="color:var(--m)">sign in to manage your bots</small>
<input class="inp" id="lu" placeholder="username" autocomplete="username"><input class="inp" id="lp" type="password" placeholder="password" autocomplete="current-password">
<div class="err" id="le"></div><button class="btn">Sign in</button></form></div>

<div id="app">
<aside><div class="top"><div class="logo">Bot<b>Forge</b></div><button class="btn g" id="out">Logout</button></div>
<div id="drop">drop .py / .zip here<br><small>or click to upload</small></div>
<input type="file" id="fi" multiple accept=".py,.zip,.txt,.env,.json,.md,.yml,.yaml,.toml" hidden>
<div id="list"></div></aside>
<main id="main"><div class="empty">upload a bot (.py or .zip) to get started</div></main>
</div>
<div id="toast"></div>

<script>
const $ = s => document.querySelector(s); let cur = null, ws = null, info = null, hist = [], hi = 0, upTarget = null;
const ANSI = /\x1b\[[0-9;?]*[A-Za-z]/g;
const toast = t => { const e = $('#toast'); e.textContent = t; e.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => e.style.display = 'none', 2800) };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
async function api(p, o = {}){
  const r = await fetch('/api' + p, { credentials: 'same-origin', ...o });
  if(r.status === 401 && p !== '/login'){ showLogin(); throw new Error('auth') }
  const j = await r.json().catch(() => ({})); if(!r.ok) throw new Error(j.detail || r.status); return j;
}
const J = (m, b) => ({ method: m, headers: { 'content-type': 'application/json' }, body: JSON.stringify(b) });
function showLogin(){ $('#login').style.display = 'grid'; $('#app').style.display = 'none'; if(ws) ws.close(); cur = null }
function showApp(){ $('#login').style.display = 'none'; $('#app').style.display = 'grid'; loadList() }

$('#lf').onsubmit = async e => { e.preventDefault(); $('#le').textContent = ''; try{ await api('/login', J('POST', { user: $('#lu').value, pass: $('#lp').value })); showApp() }catch(x){ $('#le').textContent = x.message } };
$('#out').onclick = async () => { await api('/logout', { method: 'POST' }); showLogin() };

/* ---------- list ---------- */
const fmtUp = s => s < 60 ? s + 's' : s < 3600 ? Math.floor(s / 60) + 'm' : Math.floor(s / 3600) + 'h ' + Math.floor(s % 3600 / 60) + 'm';
async function loadList(){
  try{
    const l = await api('/bots'); const box = $('#list'); box.innerHTML = '';
    l.forEach(b => {
      const d = document.createElement('div'); d.className = 'bot' + (b.id === cur ? ' on' : '');
      d.innerHTML = '<span class="dot ' + b.state + '"></span><div><b>' + esc(b.name) + '</b><small>' + b.state + (b.mem ? ' · ' + b.mem + ' MB' : '') + (b.up ? ' · ' + fmtUp(b.up) : '') + '</small></div>';
      d.onclick = () => select(b.id); box.appendChild(d);
      if(b.id === cur) setStatus(b);
    });
    if(!l.length) box.innerHTML = '<div class="empty">no bots yet</div>';
  }catch{}
}
setInterval(() => { if($('#app').style.display === 'grid') loadList() }, 3000);
function setStatus(b){
  const p = $('#pill'); if(!p) return; p.textContent = b.state; p.className = 'pill ' + b.state;
  $('#meta').textContent = (b.up ? 'up ' + fmtUp(b.up) + ' · ' : '') + (b.mem ? b.mem + ' MB · ' : '') + b.restarts + ' restarts · ' + (b.entry || 'no entry');
}

/* ---------- bot view ---------- */
async function select(id){
  cur = id; info = await api('/bots/' + id); renderBot(); connect(id); loadList();
}
function renderBot(){
  const m = $('#main');
  m.innerHTML = '<div class="hd"><h2></h2><span class="pill" id="pill"></span><small id="meta" style="color:var(--m)"></small><div class="sp"></div>' +
    '<button class="btn" data-a="start">Start</button><button class="btn g" data-a="restart">Restart</button><button class="btn g" data-a="stop">Stop</button><button class="btn g" id="upd">Update files</button><button class="btn r" id="del">Delete</button></div>' +
    '<div class="tabs"><button class="on" data-t="t">Terminal</button><button data-t="e">Environment</button><button data-t="f">Files</button></div>' +
    '<div class="pane on" id="pt"><div id="term"></div><div class="cmd"><span>$</span><input id="ci" placeholder="pip install requests  ·  ls  ·  python -V  ·  clear" autocomplete="off" spellcheck="false"><button class="btn g" id="ck">Ctrl+C</button></div></div>' +
    '<div class="pane" id="pe"><div class="scroll" id="eb"></div></div><div class="pane" id="pf"><div class="scroll" id="fb"></div></div>';
  m.querySelector('h2').textContent = info.name;
  m.querySelectorAll('[data-a]').forEach(b => b.onclick = async () => { try{ await api('/bots/' + cur + '/' + b.dataset.a, { method: 'POST' }); setTimeout(loadList, 400) }catch(e){ toast(e.message) } });
  m.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { m.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x === b)); m.querySelectorAll('.pane').forEach(p => p.classList.remove('on')); $('#p' + b.dataset.t).classList.add('on') });
  $('#upd').onclick = () => { upTarget = cur; $('#fi').click() };
  $('#del').onclick = async () => { if(confirm('delete ' + info.name + ' and all its files?')){ await api('/bots/' + cur, { method: 'DELETE' }); cur = null; if(ws) ws.close(); $('#main').innerHTML = '<div class="empty">deleted</div>'; loadList() } };
  $('#ck').onclick = () => ws && ws.send(JSON.stringify({ kill: 1 }));
  const ci = $('#ci');
  ci.onkeydown = e => {
    if(e.key === 'Enter' && ci.value.trim()){ const c = ci.value.trim(); hist.push(c); hi = hist.length; if(c === 'clear') $('#term').innerHTML = ''; ws && ws.send(JSON.stringify({ cmd: c })); ci.value = '' }
    else if(e.key === 'ArrowUp'){ hi = Math.max(0, hi - 1); ci.value = hist[hi] || ''; e.preventDefault() }
    else if(e.key === 'ArrowDown'){ hi = Math.min(hist.length, hi + 1); ci.value = hist[hi] || '' }
    else if(e.key === 'c' && e.ctrlKey) ws && ws.send(JSON.stringify({ kill: 1 }));
  };
  renderEnv(); renderFiles();
}
function renderEnv(){
  const eb = $('#eb'), saved = info.env || {}, spec = info.env_spec || [], keys = new Set();
  eb.innerHTML = '<small style="color:var(--m)">detected from <b>.env.example</b> and from os.getenv / environ calls in your code. required ones are marked.</small>';
  const add = (k, o = {}) => {
    keys.add(k); const r = document.createElement('div'); r.className = 'row';
    r.innerHTML = '<label>' + esc(k) + (o.required ? '<span class="req">required</span>' : '') + '<small>' + esc(o.hint || '') + (o.src ? ' · ' + esc(o.src) : '') + '</small></label>';
    const i = document.createElement('input'); i.className = 'inp'; i.dataset.k = k; i.type = o.secret ? 'password' : 'text'; i.value = saved[k] ?? o.default ?? ''; i.placeholder = o.default || (o.required ? 'required' : 'optional');
    if(o.secret){ i.onfocus = () => i.type = 'text'; i.onblur = () => i.type = 'password' }
    r.appendChild(i); eb.insertBefore(r, eb.querySelector('.acts'));
  };
  const a = document.createElement('div'); a.className = 'acts'; a.style.cssText = 'display:flex;gap:8px'; a.innerHTML = '<button class="btn" id="es">Save &amp; restart</button><button class="btn g" id="ea">+ Add variable</button>'; eb.appendChild(a);
  spec.forEach(s => add(s.key, s)); Object.keys(saved).filter(k => !keys.has(k)).forEach(k => add(k));
  $('#ea').onclick = () => { const k = prompt('variable name (e.g. BOT_TOKEN)'); if(k && /^[A-Za-z_]\w*$/.test(k)) add(k.toUpperCase()) };
  $('#es').onclick = async () => {
    const env = {}; eb.querySelectorAll('input[data-k]').forEach(i => { if(i.value !== '') env[i.dataset.k] = i.value });
    const miss = spec.filter(s => s.required && !env[s.key]).map(s => s.key);
    try{ await api('/bots/' + cur + '/env', J('PUT', { env, restart: true })); toast(miss.length ? 'saved. still empty: ' + miss.join(', ') : 'saved'); info.env = env }catch(e){ toast(e.message) }
  };
}
function renderFiles(){
  const fb = $('#fb'); fb.innerHTML = '<div class="row"><label>Entry file<small>the file that gets run</small></label><select class="inp" id="en"></select></div>' +
    '<div class="row"><label>Dependencies<small>' + (info.installed ? 'virtualenv ready' : 'not installed yet') + '</small></label><div><button class="btn g" id="ri">Reinstall requirements</button></div></div>' +
    '<label>requirements.txt</label><pre>' + esc(info.requirements || '(none, detected from imports on install)') + '</pre><label>Files (' + info.files.length + ')</label>';
  const en = $('#en'); info.entries.forEach(e => en.add(new Option(e, e, 0, e === info.entry)));
  en.onchange = async () => { await api('/bots/' + cur, J('PUT', { entry: en.value })); toast('entry set, restart the bot') };
  $('#ri').onclick = () => api('/bots/' + cur + '/install', { method: 'POST' }).then(() => toast('installing, watch the terminal'));
  info.files.forEach(f => { const d = document.createElement('div'); d.className = 'f'; d.innerHTML = '<span>' + esc(f.path) + '</span><small>' + (f.size > 1024 ? (f.size / 1024).toFixed(1) + ' KB' : f.size + ' B') + '</small>'; fb.appendChild(d) });
}

/* ---------- terminal ---------- */
function out(t){
  const term = $('#term'); if(!term) return; const near = term.scrollHeight - term.scrollTop - term.clientHeight < 80;
  t.split('\n').forEach(l => { const d = document.createElement('div'); d.textContent = l.replace(ANSI, '').replace(/\r/g, ''); if(l.startsWith('[host]')) d.className = 'h'; else if(l.startsWith('$ ')) d.className = 'c'; else if(/Traceback|Error|error:|Exception/.test(l)) d.className = 'e'; term.appendChild(d) });
  while(term.children.length > 3000) term.firstChild.remove();
  if(near) term.scrollTop = term.scrollHeight;
}
function connect(id){
  if(ws){ ws.onclose = null; ws.close() }
  const t = $('#term'); if(t) t.innerHTML = '';
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws/' + id);
  ws.onmessage = e => out(e.data);
  ws.onclose = () => { if(cur === id) setTimeout(() => cur === id && connect(id), 2000) };
}
setInterval(async () => { if(cur && info){ try{ const n = await api('/bots/' + cur); if(n.requirements !== info.requirements || n.entry !== info.entry || n.files.length !== info.files.length){ info = n; renderFiles(); renderEnv() } }catch{} } }, 6000);

/* ---------- upload ---------- */
async function upload(files){
  if(!files.length) return; const fd = new FormData();
  [...files].forEach(f => fd.append('files', f));
  if(upTarget) fd.append('bot', upTarget); else fd.append('name', files[0].name.replace(/\.\w+$/, ''));
  toast('uploading...');
  try{ const r = await api('/bots', { method: 'POST', body: fd }); upTarget = null; toast('uploaded. installing dependencies...'); await select(r.id) }catch(e){ toast(e.message) }
}
const drop = $('#drop');
drop.onclick = () => { upTarget = null; $('#fi').click() };
$('#fi').onchange = e => { upload(e.target.files); e.target.value = '' };
['dragover', 'dragenter'].forEach(ev => document.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('on') }));
['dragleave', 'drop'].forEach(ev => document.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('on') }));
document.addEventListener('drop', e => { upTarget = cur && e.target.closest('main') ? cur : null; upload(e.dataTransfer.files) });

api('/bots').then(showApp).catch(() => showLogin());
</script></body></html>
